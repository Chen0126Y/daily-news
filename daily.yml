name: daily-news
on:
  schedule:
    - cron: "0 * * * *"   # 每小时跑一次，脚本自己判断是否到了当地10点
  workflow_dispatch:       # 可在 Actions 页面手动点“Run workflow”立即发送
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python news_digest.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
